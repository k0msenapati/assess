[project]
name = "assess-backend"
version = "0.1.0"
description = "Assess - Academic Integrity & Automated Feedback System"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "groq>=0.37.1",
    "httpx>=0.28.1",
    "langchain>=1.4.0",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.18.1",
    "pytest>=9.1.1",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "ruff>=0.12.0",
    "sqlalchemy>=2.0.53",
    "sqlmodel>=0.0.42",
    "uvicorn[standard]>=0.53.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["uploads"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
